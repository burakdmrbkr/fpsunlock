name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner ships an Android SDK; only the platform and build-tools
      # for this project need adding. Avoids android-actions/setup-android, which
      # fails on current runner images trying to install the retired 'tools' package.
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fpsunlock-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
