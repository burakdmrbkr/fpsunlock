pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Xposed API stubs (compileOnly). Falls back to the vendored jar if unreachable.
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = "fpsunlock"
include ':app'
